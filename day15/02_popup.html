<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        popup => window의 메서드 종류
    </h1>
    <!-- 
        alert() / prompt() input 포함 / confirm() 확인 / 취소

        window.open('url', 'window name', option(size, scroll));
        winodw.close();

    -->

    <button onclick="openWindow()">popup 열기</button>
    <button onclick="closeWindow()">popup 닫기</button>
    <button onclick="alertEc()">alert</button>
    <button onclick="promptEx()">prompt</button>
    <button onclick="comfirmEx()">comfirm</button>

    <h3 id="h3"></h3>

    <script>
        function comfirmEx(){
            let con = comfirm('확인하시겠습니기');
            if(con){
                document.getElementById('h3').innerText = '확인';
            }else{
                document.getElementById('h3').innerText = '취소';
            }
        }
        function promptEx(){
            prompt('입력해 주세요');
        }
        function alertEc(){
            alert('alert 창입니다.');
        }
        let popup;

        function openWindow(){
            popup = window.open('01_BOM.html', 'mypop', 'width=400, height=500');
        }

        function closeWindow(){
            if(popup){
                popup.close();
            }
        }
    </script>
</body>
</html>
