<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List 만들기</title>
    <style>
        h1{
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            background-color: aqua;
        }
        form{
            display: flex;
            justify-content: center;
            font-size: 20px;
            background-color: aquamarine;
        }
        form>input{
            background-color: aquamarine;
        }
        form>button{
            background-color: aquamarine;
        }
        #itemList>ul{
            width: 100%;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <h1>여행 준비물 점검 목록</h1>
    <form action="">
        <input type="text" id="item">
        <button type="button" id="btn">추가</button>
    </form>

    <div>
        <ul id="itemList"></ul>
    </div>

    <script>
        const btn = document.getElementById('btn');
        const itemList = document.getElementById('itemList');
        const item = document.getElementById('item');
        let index = 0;

        btn.addEventListener('click', ()=>{
            if(item.value.trim() == '') return;

            itemList.innerHTML += `<li id="index${index}">${item.value} \t <button type="button" class="remove">❌</button></li>`;
            item.value = '';
            index++;

        });

        itemList.addEventListener('click', (e)=>{
            const btnRemove = e.target.closest('.remove');
            if (!btnRemove) return;
            const li = btnRemove.closest('li');
            if (li) li.remove();
        })
    </script>
</body>
</html>
